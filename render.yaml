services:
  - type: web
    name: items-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: items-api-db
          property: connectionString

databases:
  - name: items-api-db
    databaseName: api_db
    user: api
    plan: free
    postgresMajorVersion: "16"
