services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_db}
      POSTGRES_USER: ${POSTGRES_USER:-api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api} -d ${POSTGRES_DB:-api_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: items-api:local
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-api}:${POSTGRES_PASSWORD:-api_local_password}@db:5432/${POSTGRES_DB:-api_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
volumes:
  postgres_data:
  n8n_data:
    external: true
    name: n8n_data
